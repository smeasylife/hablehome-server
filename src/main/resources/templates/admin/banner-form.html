<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head(${mode == 'edit'} ? '배너 수정' : '배너 등록')}"></head>
<body>
<div class="admin-shell">
  <aside th:replace="~{admin/fragments :: sidebar('banners')}"></aside>
  <div class="content">
    <header th:replace="~{admin/fragments :: topbar}"></header>
    <main class="page">
      <div class="page-header">
        <div>
          <p class="eyebrow">Promotion</p>
          <h1 th:text="${mode == 'edit'} ? '배너 수정' : '배너 등록'">배너 등록</h1>
          <p class="summary">고객에게 보이는 문구와 사진을 입력하고, 버튼이 이동할 상품을 선택합니다.</p>
        </div>
        <a class="button" th:href="@{/admin/banners}">목록으로</a>
      </div>

      <form class="form banner-form"
            th:object="${bannerForm}"
            th:action="${mode == 'edit'} ? @{/admin/banners/{id}(id=${bannerId})} : @{/admin/banners}"
            method="post"
            enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{retainedImageUrl}">

        <section class="form-panel">
          <h2>화면 문구</h2>
          <div class="grid form-grid-2">
            <label>
              <span>큰 글씨</span>
              <input th:field="*{largeText}" placeholder="예: 하루 끝을 더 부드럽게" required>
            </label>
            <label>
              <span>작은 글씨</span>
              <input th:field="*{smallText}" placeholder="예: 클린 코튼 차렵이불과 함께 침실의 계절감을 바꿔보세요." required>
            </label>
          </div>
        </section>

        <section class="form-panel">
          <h2>사진</h2>
          <div class="banner-current-image" th:if="${mode == 'edit' && !#strings.isEmpty(bannerForm.retainedImageUrl)}">
            <img th:src="${bannerForm.retainedImageUrl}" alt="">
            <p class="muted">새 사진을 선택하면 현재 사진이 교체됩니다.</p>
          </div>
          <label class="file-input">
            <span th:text="${mode == 'edit'} ? '새 사진 선택' : '배너 사진'">배너 사진</span>
            <input type="file" name="imageFile" accept="image/*" th:required="${mode != 'edit'}" data-image-input>
          </label>
          <div class="image-list" data-image-preview></div>
        </section>

        <section class="form-panel">
          <h2>버튼 연결</h2>
          <div class="grid form-grid-3">
            <label>
              <span>버튼 글씨</span>
              <input th:field="*{buttonLabel}" placeholder="예: 상품 보기" required>
            </label>
            <label>
              <span>연결 상품</span>
              <select th:field="*{targetItemId}" required>
                <option value="">상품 선택</option>
                <option th:each="item : ${items}"
                        th:value="${item.id}"
                        th:text="|${item.name} (${#numbers.formatInteger(item.salePrice, 0, 'COMMA')}원)|">상품명</option>
              </select>
            </label>
            <label>
              <span>노출 순서</span>
              <input type="number" min="0" th:field="*{displayOrder}" required>
            </label>
          </div>
        </section>

        <button class="button primary" type="submit">저장</button>
      </form>
    </main>
  </div>
</div>
<script>
  const imageInput = document.querySelector("[data-image-input]");
  const imagePreview = document.querySelector("[data-image-preview]");

  imageInput.addEventListener("change", () => {
    imagePreview.innerHTML = "";
    const file = imageInput.files && imageInput.files[0];
    if (!file) {
      return;
    }
    const figure = document.createElement("figure");
    figure.className = "image-choice";
    const image = document.createElement("img");
    image.src = URL.createObjectURL(file);
    image.alt = "";
    const caption = document.createElement("figcaption");
    caption.textContent = file.name;
    figure.append(image, caption);
    imagePreview.appendChild(figure);
  });
</script>
</body>
</html>
