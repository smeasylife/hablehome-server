<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">HABLE Admin</title>
  <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
  <div class="brand">
    <div>
      <p class="brand-kicker">HABLE</p>
      <p class="brand-title">Admin</p>
    </div>
  </div>
  <nav class="nav">
    <a th:classappend="${active == 'dashboard'} ? 'active'" th:href="@{/admin}">대시보드</a>
    <a th:classappend="${active == 'products'} ? 'active'" th:href="@{/admin/products}">상품 목록</a>
    <a th:classappend="${active == 'product-new'} ? 'active'" th:href="@{/admin/products/new}">상품 등록</a>
    <a th:classappend="${active == 'questions'} ? 'active'" th:href="@{/admin/questions}">QnA 답변</a>
    <a th:classappend="${active == 'reviews'} ? 'active'" th:href="@{/admin/reviews}">리뷰 답변</a>
    <form th:action="@{/admin/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit">로그아웃</button>
    </form>
  </nav>
</aside>

<header class="topbar" th:fragment="topbar">
  <div>
    <p class="muted">관리자 콘솔</p>
    <p class="topbar-title">Hable 운영 관리</p>
  </div>
  <a class="button" th:href="@{/}">쇼핑몰 보기</a>
</header>
</body>
</html>
