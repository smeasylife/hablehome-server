<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('상품 목록')}"></head>
<body>
<div class="admin-shell">
  <aside th:replace="~{admin/fragments :: sidebar('products')}"></aside>
  <div class="content">
    <header th:replace="~{admin/fragments :: topbar}"></header>
    <main class="page">
      <div class="page-header">
        <div>
          <p class="eyebrow">Products</p>
          <h1>상품 목록</h1>
          <p class="summary">등록된 상품을 확인하고 수정, 삭제 작업으로 이동합니다.</p>
        </div>
        <a class="button primary" th:href="@{/admin/products/new}">상품 등록</a>
      </div>

      <section class="table">
        <div class="table-row table-head">
          <span>이미지</span>
          <span>상품</span>
          <span>가격</span>
          <span>관리</span>
        </div>
        <div class="table-row" th:each="item : ${items}">
          <img class="thumb" th:src="${item.pictureUrl}" th:alt="${item.name}">
          <div>
            <strong th:text="${item.name}">상품명</strong>
            <p class="muted" th:text="${item.color}">색상</p>
          </div>
          <div>
            <strong th:text="${#numbers.formatInteger(item.salePrice, 0, 'COMMA')} + '원'">0원</strong>
            <p class="muted" th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'">0원</p>
          </div>
          <div class="actions">
            <a class="icon-button" th:href="@{/admin/products/{id}/edit(id=${item.id})}">수정</a>
            <form th:action="@{/admin/products/{id}/delete(id=${item.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="icon-button danger" type="submit">삭제</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
