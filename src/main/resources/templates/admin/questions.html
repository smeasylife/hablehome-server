<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('QnA 답변')}"></head>
<body>
<div class="admin-shell">
  <aside th:replace="~{admin/fragments :: sidebar('questions')}"></aside>
  <div class="content">
    <header th:replace="~{admin/fragments :: topbar}"></header>
    <main class="page">
      <div class="page-header">
        <div>
          <p class="eyebrow">QnA</p>
          <h1>QnA 답변</h1>
          <p class="summary">등록된 상품 문의를 확인하고 관리자 답변을 작성합니다.</p>
        </div>
      </div>

      <section class="work-list">
        <article class="work-item" th:each="question : ${questions}">
          <div>
            <span class="badge" th:classappend="${question.answer != null and !question.answer.isBlank()} ? 'done'"
                  th:text="${question.answer != null and !question.answer.isBlank()} ? '답변 완료' : '미답변'">미답변</span>
            <h2 th:text="${question.title}">문의 제목</h2>
            <p class="summary" th:text="${question.content}">문의 내용</p>
            <p class="muted">
              <span th:text="${question.itemName}">상품</span>
              <span> · </span>
              <span th:text="${question.nickname}">작성자</span>
            </p>
          </div>
          <div>
            <form th:action="@{/admin/questions/{id}/answer(id=${question.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <textarea name="content" th:text="${question.answer}" placeholder="관리자 답변 입력"></textarea>
              <div class="actions">
                <button class="button primary" type="submit">저장</button>
              </div>
            </form>
            <form class="actions" th:if="${question.answer != null and !question.answer.isBlank()}"
                  th:action="@{/admin/questions/{id}/answer/delete(id=${question.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="button danger" type="submit">삭제</button>
            </form>
          </div>
        </article>
      </section>
    </main>
  </div>
</div>
</body>
</html>
