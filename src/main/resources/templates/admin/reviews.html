<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('리뷰 답변')}"></head>
<body>
<div class="admin-shell">
  <aside th:replace="~{admin/fragments :: sidebar('reviews')}"></aside>
  <div class="content">
    <header th:replace="~{admin/fragments :: topbar}"></header>
    <main class="page">
      <div class="page-header">
        <div>
          <p class="eyebrow">Reviews</p>
          <h1>리뷰 답변</h1>
          <p class="summary">고객 리뷰를 확인하고 관리자 답변을 작성합니다.</p>
        </div>
      </div>

      <section class="work-list">
        <article class="work-item" th:each="review : ${reviews}">
          <div>
            <span class="badge" th:classappend="${review.adminComment != null and !review.adminComment.isBlank()} ? 'done'"
                  th:text="${review.adminComment != null and !review.adminComment.isBlank()} ? '답변 완료' : '미답변'">미답변</span>
            <p class="muted">
              <span th:text="${review.itemName}">상품</span>
              <span> · </span>
              <span th:text="${review.nickname}">작성자</span>
              <span> · 평점 </span>
              <span th:text="${review.rating}">5</span>
            </p>
            <p class="summary" th:text="${review.content}">리뷰 내용</p>
            <div class="category-list" th:if="${!review.imageUrls.isEmpty()}">
              <img class="thumb" th:each="imageUrl : ${review.imageUrls}" th:src="${imageUrl}" alt="">
            </div>
          </div>
          <div>
            <form th:action="@{/admin/reviews/{id}/comment(id=${review.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <textarea name="content" th:text="${review.adminComment}" placeholder="관리자 답변 입력"></textarea>
              <div class="actions">
                <button class="button primary" type="submit">저장</button>
              </div>
            </form>
            <form class="actions" th:if="${review.adminComment != null and !review.adminComment.isBlank()}"
                  th:action="@{/admin/reviews/{id}/comment/delete(id=${review.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="button danger" type="submit">삭제</button>
            </form>
          </div>
        </article>
      </section>
    </main>
  </div>
</div>
</body>
</html>
